plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation files('../SWEEP-core/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar')
    implementation 'org.ejml:ejml-all:0.44.0'
    implementation 'com.github.sh0nk:matplotlib4j:0.5.0'
}

tasks.named('compileJava') {
    dependsOn(':SWEEP-core:assembleRelease')
}

java {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
}